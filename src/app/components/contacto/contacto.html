<section style="display: grid; grid-template-columns: 1fr 1.2fr; gap: 4rem; align-items: start; padding: 1rem 0;">
  <div>
    <small style="color: var(--accent-coral); font-weight: 800; font-size: 0.8rem; letter-spacing: 1px;">HABLEMOS</small>
    <h1 style="font-size: 2.8rem; font-weight: 800; margin: 0.8rem 0 1.2rem; line-height: 1.15;">Tu pregunta también puede abrir una historia.</h1>
    <p style="color: var(--text-muted); margin-bottom: 2.5rem; font-size: 1.05rem;">Escríbenos para compartir una pista, corregir un dato, proponer una colaboración o saludarnos.</p>

    <div style="display: flex; flex-direction: column; gap: 1.2rem; color: var(--text-dark); font-size: 1rem;">
      <p style="display: flex; align-items: center; gap: 10px;">✉️ <strong>hola&#64;nexodiario.co</strong></p>
      <p style="display: flex; align-items: center; gap: 10px;">📞 <strong>+57 601 555 0148</strong></p>
      <p style="display: flex; align-items: center; gap: 10px;">📍 <strong>Bogotá, Colombia</strong></p>
    </div>
  </div>

  <div style="background: white; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
    <h2 style="margin-bottom: 1.8rem; font-size: 1.5rem; font-weight: 800;">Envíanos un mensaje</h2>

    <form (ngSubmit)="enviarFormulario()" #contactoForm="ngForm">
      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.4rem;">Nombre *</label>
        <input type="text" [(ngModel)]="nombre" name="nombre" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); outline: none; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.4rem;">Correo electrónico *</label>
        <input type="email" [(ngModel)]="correo" name="correo" required email style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); outline: none; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.2rem;">
        <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.4rem;">Asunto *</label>
        <input type="text" [(ngModel)]="asunto" name="asunto" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); outline: none; font-size: 0.95rem;">
      </div>

      <div style="margin-bottom: 1.8rem;">
        <label style="display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 0.4rem;">Mensaje *</label>
        <textarea [(ngModel)]="mensaje" name="mensaje" required rows="4" style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 12px; font-family: var(--font-sans); outline: none; font-size: 0.95rem; resize: vertical;"></textarea>
      </div>

      <button type="submit" [disabled]="!contactoForm.form.valid" class="btn-blue" style="width: 100%; justify-content: center; padding: 0.9rem;">
        Enviar mensaje &rarr;
      </button>
    </form>

    <div *ngIf="mensajeEnviado" style="margin-top: 1.2rem; padding: 1rem; background-color: var(--badge-green-bg); color: var(--badge-green-text); border-radius: 12px; font-weight: 700; text-align: center;">
      ✓ Mensaje enviado. Te responderemos muy pronto.
    </div>
  </div>
</section>
