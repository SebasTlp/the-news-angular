<section *ngIf="noticia" style="max-width: 900px; margin: 3rem auto; padding: 0 1.5rem;">
  <a routerLink="/noticias" style="color: var(--primary-blue); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 1.5rem;">
    &larr; Volver al catálogo
  </a>

  <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 1rem;">
    <span style="background-color: var(--badge-green-bg); color: var(--badge-green-text); padding: 4px 12px; border-radius: 12px; font-weight: 800; font-size: 0.8rem;">
      {{ noticia.categoria }}
    </span>
    <span style="color: var(--text-muted); font-size: 0.9rem;">⏱️ {{ noticia.tiempoLectura }} de lectura</span>
  </div>

  <h1 style="font-size: 2.8rem; font-weight: 800; line-height: 1.2; margin-bottom: 1.5rem;">
    {{ noticia.titulo }}
  </h1>

  <div style="border-radius: var(--radius-lg); overflow: hidden; height: 450px; margin-bottom: 2.5rem; box-shadow: var(--shadow-md);">
    <img [src]="noticia.imagen" [alt]="noticia.titulo" style="width: 100%; height: 100%; object-fit: cover;">
  </div>

  <div style="background: white; padding: 2.5rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);">
    <p style="font-size: 1.2rem; font-weight: 600; color: var(--text-dark); margin-bottom: 1.5rem; line-height: 1.6;">
      {{ noticia.resumen }}
    </p>
    <hr style="border: 0; border-top: 1px solid var(--border-color); margin-bottom: 1.5rem;">
    <p style="font-size: 1.05rem; color: #334155; line-height: 1.8;">
      {{ noticia.contenido }}
    </p>

    <div style="margin-top: 2.5rem; display: flex; justify-content: space-between; align-items: center;">
      <button class="btn-pill-primary" (click)="guardarFavorito()">
        🔖 Guardar en Favoritos
      </button>
    </div>
  </div>
</section>
