<section style="padding: 3rem 5%;">
  <div style="margin-bottom: 2rem;">
    <small style="color: var(--accent-coral); font-weight: 800; font-size: 0.8rem; letter-spacing: 1px;">TU COLECCIÓN</small>
    <h1 style="font-size: 2.5rem; font-weight: 800;">Noticias Guardadas</h1>
  </div>

  <div *ngIf="favoritos.length === 0" style="text-align: center; padding: 5rem 2rem; background: white; border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
    <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 1.5rem;">Aún no has guardado ninguna noticia en tus favoritos.</p>
    <a routerLink="/noticias" class="btn-pill-primary">Explorar el catálogo &rarr;</a>
  </div>

  <div class="cards-grid" *ngIf="favoritos.length > 0">
    <article class="card" *ngFor="let noticia of favoritos">
      <div class="card-img-wrapper">
        <img [src]="noticia.imagen" [alt]="noticia.titulo">
      </div>
      <div class="card-body">
        <div class="card-meta">
          <span>{{ noticia.categoria }}</span>
          <span>{{ noticia.tiempoLectura }}</span>
        </div>
        <h3 class="card-title">{{ noticia.titulo }}</h3>
        <p class="card-excerpt">{{ noticia.resumen }}</p>
        <div class="card-footer">
          <a [routerLink]="['/detalle', noticia.id]" style="color: var(--primary-blue); text-decoration: none; font-weight: 700; font-size: 0.95rem;">
            Leer completa &rarr;
          </a>
        </div>
      </div>
    </article>
  </div>
</section>
